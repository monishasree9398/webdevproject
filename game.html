    <style>


        body {
             background-image :url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZiKEV88wH2vOF0ANJlOUndkUWzTGboUpK1t0zkiUJakOdh89we9ZQrrb4&s=10");
             
             background-size:100% 850px;
             background-repeat: no-repeat;
            margin: 0;
            padding-bottom: 100px;

           

            

            font-family: Georgia, serif;

            text-align: center;
        }



         .navg {
            display: flex; 
            gap: 100px; 
            justify-content: center;
            align-items: center; 
            height: 50px;
            position: sticky;
            
            background: #050505;
            border-bottom: 2px solid darkred;
        }   

        .navg a {
            color: whitesmoke;
            text-decoration: none;
        }

        .navg a:hover {
            color: red;
        }


        h1 {
            margin-top: 55px;
            margin-bottom: 8px;

            color: rgb(124, 8, 8);

            font-size: 36px;

            font-weight: bold;

            letter-spacing: 8px;
        }

        p {
            margin-top: 0;

            color: #77716b;

            font-size: 26px;
        }


      


        .game {

            width: 540px;

            margin: 45px auto;

            padding: 25px;

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 40px;

            background-color: transparent;

            border: none;

            box-sizing: border-box;
        }


        
        .card {

            height: 140px;

            perspective: 1000px;

            cursor: pointer;
        }


        .cardinner {

            width: 100%;
            height: 100%;

            position: relative;

            transition: transform 0.6s;

            transform-style: preserve-3d;
        }


       
        .card.flipped .cardinner,
        .card.matched .cardinner {

            transform: rotateY(180deg);

        }



        .front,
        .back {

            position: absolute;

            width: 100%;
            height: 100%;

            box-sizing: border-box;

            display: flex;

            justify-content: center;

            align-items: center;

            backface-visibility: hidden;

            font-size: 42px;
        }


        

        .front {

            background-color: #171413;

            color: rgb(124, 8, 8);

            border: 1px solid #642222;
        }


        .front:hover {

            background-color: #211716;

            border-color: #ec0909;
        }



        .back {

            background-color: #211d19;

            border: 1px red;

            transform: rotateY(180deg);
        }


      
        #win {

            display: none;

            margin-top: 30px;

            color: rgb(124, 8, 8);

            font-size: 28px;
        }


       

        button {

            margin-top: 5px;

            padding: 10px 24px;

            background-color: #641b1b;

            color: #eee;

            border: 1px solid #8c3030;

            font-family: Georgia, serif;

            cursor: pointer;
        }

        button:hover {

            background-color: #842222;
        }


      

        .next {

            position: fixed;

            right: 30px;

            bottom: 25px;

            z-index: 1000;
        }

        .next img {

            width: 110px;

            height: 110px;

            
        }

       


        

        @media (max-width: 650px) {

            .navg {

                gap: 15px;

            }

            .navg a {

                font-size: 10px;

            }

            .game {

                width: 90%;

                padding: 15px;

                gap: 10px;

            }

            .card {

                height: 100px;

            }

            h1 {

                font-size: 25px;

                letter-spacing: 4px;

            }

        }

    </style>

</head>


<body>
    



  

    <h1>
        THE CURSED CARDS
    </h1>

    <p>
        Find all 4 matching pairs
    </p>


    <div class="game">


        <div class="card" data-card="ghost">

            <div class="cardinner">

                <div class="front">?</div>

                <div class="back">👻</div>

            </div>

        </div>


        <div class="card" data-card="skull">

            <div class="cardinner">

                <div class="front">?</div>

                <div class="back">☠️</div>

            </div>

        </div>


        <div class="card" data-card="blood">

            <div class="cardinner">

                <div class="front">?</div>

                <div class="back">🩸</div>

            </div>

        </div>


        <div class="card" data-card="spider">

            <div class="cardinner">

                <div class="front">?</div>

                <div class="back">🕷️</div>

            </div>

        </div>


        <div class="card" data-card="blood">

            <div class="cardinner">

                <div class="front">?</div>

                <div class="back">🩸</div>

            </div>

        </div>


        <div class="card" data-card="ghost">

            <div class="cardinner">

                <div class="front">?</div>

                <div class="back">👻</div>

            </div>

        </div>


        <div class="card" data-card="spider">

            <div class="cardinner">

                <div class="front">?</div>

                <div class="back">🕷️</div>

            </div>

        </div>


        <div class="card" data-card="skull">

            <div class="cardinner">

                <div class="front">?</div>

                <div class="back">☠️</div>

            </div>

        </div>


    </div>


  
    <div id="win">

        YOU SURVIVED👁️

        <br>
        <br>

        <button onclick="location.reload()">
            PLAY AGAIN
        </button>

    </div>


    <div class="next">

        <a href="doors.html">

            <img
            src="https://png.pngtree.com/png-clipart/20230309/ourmid/pngtree-red-color-vampire-realistic-magical-fantasy-eye-pupil-eyeball-png-image_6639072.png"
            alt="Eyeball">

        </a>

    </div>



    <script>

        const cards = document.querySelectorAll(".card");

        let firstCard = null;
        let secondCard = null;
        let lockBoard = false;
        let matchedPairs = 0;

        cards.forEach(card => {

            card.addEventListener("click", () => {

                if (lockBoard) return;

                if (card === firstCard) return;

                if (card.classList.contains("matched")) return;

                card.classList.add("flipped");

                if (!firstCard) {

                    firstCard = card;

                    return;
                }

                secondCard = card;

                lockBoard = true;

                const match =
                    firstCard.dataset.card ===
                    secondCard.dataset.card;

                if (match) {

                    firstCard.classList.add("matched");

                    secondCard.classList.add("matched");

                    matchedPairs++;

                    resetBoard();

                    if (matchedPairs === 4) {

                        document.getElementById("win").style.display = "block";

                    }

                } else {

                    setTimeout(() => {

                        firstCard.classList.remove("flipped");

                        secondCard.classList.remove("flipped");

                        resetBoard();

                    }, 900);

                }

            });

        });


        function resetBoard() {

            firstCard = null;

            secondCard = null;

            lockBoard = false;

        }

    </script>


</body>

</html>
